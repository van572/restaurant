<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menú Digital - Restaurante</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="assets/css/notificaciones.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #ff6b00;
            --primary-dark: #e65c00;
            --bg: #0f1115;
            --card-bg: #1c1f26;
            --text-main: #ffffff;
            --text-muted: #aebac1;
            --border: rgba(255, 255, 255, 0.05);
            --success: #00e676;
            --shadow: 0 8px 30px rgba(0,0,0,0.4);
            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 107, 0, 0.05) 0%, transparent 60%);
        }

        .header {
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('assets/img/hero_dark_waves.jpg');
            background-size: cover;
            background-position: center;
            padding: 40px 20px;
            position: relative;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 107, 0, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
        }

        .mesa-badge {
            background-color: var(--primary);
            color: white;
            padding: 8px 20px;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
        }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes revealPlatillo {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .container {
            padding: 16px;
            padding-bottom: 120px; /* Espacio para el carrito flotante */
            animation: pageFadeIn 0.6s ease-out forwards;
        }

        .categoria-section {
            margin-bottom: 45px;
            padding: 0 4px;
        }

        .categoria-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin: 30px 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary);
        }

        /* PLATILLO CARDS EN GRID */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            padding: 10px 0 30px;
        }

        .platillo-card {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 16px;
            display: flex;
            gap: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            animation: revealPlatillo 0.6s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        .platillo-card:active {
            transform: scale(0.97);
            background: #252525;
        }

        .platillo-emoji {
            font-size: 2.2rem;
            background: rgba(255, 255, 255, 0.03);
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .platillo-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .platillo-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 4px;
        }

        .platillo-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .platillo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .platillo-price {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .add-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(255, 107, 0, 0.3);
            transition: 0.2s;
        }

        .add-btn:active {
            transform: scale(0.9);
        }

        /* BOTTOM BAR / FLOAT CART */
        .cart-bar {
            position: fixed;
            bottom: 30px;
            left: 5%;
            right: 5%;
            background: var(--primary);
            padding: 16px 24px;
            border-radius: 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 15px 30px rgba(255, 107, 0, 0.4);
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
        }

        .cart-bar:active {
            transform: scale(0.96);
        }

        .cart-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cart-count {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 800;
        }

        .cart-total {
            font-weight: 800;
            font-size: 1.2rem;
        }

        .view-cart-btn {
            background: transparent;
            color: white;
            border: none;
            font-weight: 800;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* MODAL CARRITO */
        #cart-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            display: none;
            align-items: flex-end;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: #1a1a1a;
            color: #fff;
            width: 100%;
            max-height: 92vh;
            border-radius: 32px 32px 0 0;
            padding: 30px 24px;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
        }

        .close-modal {
            background: rgba(255,255,255,0.05);
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #fff;
            cursor: pointer;
        }

        .cart-item {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .item-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .item-qty-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #000;
            padding: 6px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .qty-btn {
            background: #252525;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 2px;
        }

        .item-price {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .item-subtotal {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .item-notes {
            margin-top: 5px;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.9rem;
            background: rgba(0,0,0,0.2);
            color: #ccc;
            outline: none;
        }

        .confirm-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 800;
            margin-top: 30px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255,92,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .confirm-btn:active {
            transform: scale(0.98);
        }

        .cart-summary-total {
            background: #252525;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .cart-summary-total span:first-child {
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
        }

        .cart-summary-total span:last-child {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--primary);
        }

        /* ESTADOS DE CARGA / ERROR */
        .loading-view, .error-view, .success-view {
            text-align: center;
            padding: 40px 20px;
        }

        .loading-spinner {
            border: 4px solid rgba(0,0,0,0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* QR ALERT */
        .qr-alert {
            background: #FFF3CD;
            color: #856404;
            padding: 16px;
            border-radius: 12px;
            margin: 20px;
            border: 1px solid #FFEEBA;
            text-align: center;
            font-size: 0.9rem;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-circle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .action-circle-btn:active {
            transform: scale(0.9);
            background: var(--primary);
        }

        /* MODALES */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-card {
            background: var(--card-bg);
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--border);
            animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        .form-control {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            color: white;
            font-size: 1rem;
        }

        .pm-wait-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            z-index: 3000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div id="app">
        <header class="header">
            <div>
                <h1>La Cocina Real</h1>
            </div>
            <div class="header-actions">
                <button class="action-circle-btn" onclick="openPagoMovil()" title="Pago Movil">
                    <ion-icon name="card-outline"></ion-icon>
                </button>
                <div id="mesa-indicator" class="mesa-badge">Mesa ...</div>
                <button class="action-circle-btn" onclick="solicitarMesa('mesero')" title="Llamar Mesero">
                    <ion-icon name="notifications-outline"></ion-icon>
                </button>
            </div>
        </header>

        <!-- Barra de Estado de Pedido Activo (Flotante Superior) -->
        <div id="order-status-overlay" style="display: none; background: rgba(26, 28, 30, 0.95); position: fixed; top: 80px; left: 16px; right: 16px; z-index: 150; padding: 12px 16px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); align-items: center; gap: 12px; color: white;">
            <div style="background: var(--primary); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <ion-icon id="status-step-icon" name="timer-outline" style="font-size: 1.2rem;"></ion-icon>
            </div>
            <div style="flex: 1;">
                <div id="status-step-text" style="font-size: 0.85rem; font-weight: 700; margin-bottom: 4px;">Recibido 📝</div>
                <div style="background: rgba(255,255,255,0.1); height: 4px; border-radius: 2px; width: 100%;">
                    <div id="status-progress-bar" style="background: var(--primary); height: 100%; width: 33%; border-radius: 2px; transition: width 0.5s ease-in-out;"></div>
                </div>
            </div>
            <button onclick="this.parentElement.style.display='none'" style="background: none; border: none; color: white; opacity: 0.5;">
                <ion-icon name="close"></ion-icon>
            </button>
        </div>

        <div id="main-content" class="container">
            <!-- Los productos se cargarán dinámicamente aquí -->
            <div class="loading-view">
                <div class="loading-spinner"></div>
                <p>Cargando menú delicioso...</p>
            </div>
        </div>

        <!-- Barra de Carrito Flotante -->
        <div id="cart-bar" class="cart-bar">
            <div class="cart-info">
                <div class="cart-count">0</div>
                <div class="cart-total">$0.00</div>
            </div>
            <button class="view-cart-btn" onclick="openCart()">
                Ver pedido
                <ion-icon name="chevron-forward-outline"></ion-icon>
            </button>
        </div>
    </div>

    <!-- Modal de Carrito -->
    <div id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Tu Pedido</h2>
                <div class="close-modal" onclick="closeCart()">
                    <ion-icon name="close-outline"></ion-icon>
                </div>
            </div>
            
            <div id="cart-items-list">
                <!-- Items del carrito se generan dinámicamente -->
            </div>

            <div class="cart-summary-total">
                <span>Total a Pagar</span>
                <span id="modal-total">$0.00</span>
            </div>

            <button id="send-order-btn" class="confirm-btn" onclick="enviarPedidoCliente()">
                <ion-icon name="paper-plane-outline"></ion-icon>
                Enviar pedido a cocina
            </button>
        </div>
    </div>

    <!-- MODAL PAGO MOVIL -->
    <div id="pm-modal" class="modal-overlay">
        <div class="modal-card" style="max-width: 400px; background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1);">
            <div class="modal-header" style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                <h2 style="color: #fff; font-size: 1.4rem;">Pago Móvil 📲</h2>
                <div class="close-modal" onclick="closePagoMovil()" style="background: rgba(255,255,255,0.05); width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer;">
                    <ion-icon name="close-outline"></ion-icon>
                </div>
            </div>
            <div class="modal-body" style="padding: 24px;">
                <div style="background: rgba(255, 107, 0, 0.05); padding: 20px; border-radius: 20px; margin-bottom: 24px; border: 1px solid rgba(255, 107, 0, 0.15);">
                    <p style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">Datos del Comercio:</p>
                    <p id="pm-info-banco" style="font-weight: 700; font-size: 1.1rem; color: #fff; margin-bottom: 4px;">Cargando...</p>
                    <p id="pm-info-rif" style="font-weight: 700; margin-bottom: 4px; color: #ccc;">Cargando...</p>
                    <p id="pm-info-telefono" style="font-weight: 800; color: var(--primary); font-size: 1.25rem;">Cargando...</p>
                </div>
                
                <div class="form-group" style="margin-bottom: 18px;">
                    <label style="color: #888; font-size: 0.8rem; display: block; margin-bottom: 6px;">Banco Emisor</label>
                    <select id="pm-banco" class="form-control" style="background: #000; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 14px; border-radius: 14px; width: 100%; outline: none;">
                        <option value="">Selecciona tu banco</option>
                        <option value="0102 - Banco de Venezuela">Banco de Venezuela</option>
                        <option value="0105 - Mercantil">Mercantil</option>
                        <option value="0108 - Provincial">Provincial</option>
                        <option value="0134 - Banesco">Banesco</option>
                        <option value="0172 - Bancamiga">Bancamiga</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 18px;">
                    <label style="color: #888; font-size: 0.8rem; display: block; margin-bottom: 6px;">Teléfono Emisor</label>
                    <input type="tel" id="pm-telefono" class="form-control" placeholder="04141234567" style="background: #000; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 14px; border-radius: 14px; width: 100%; outline: none;">
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label style="color: #888; font-size: 0.8rem; display: block; margin-bottom: 6px;">Últimos 6 dígitos de Referencia</label>
                    <input type="number" id="pm-referencia" class="form-control" placeholder="123456" style="background: #000; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 14px; border-radius: 14px; width: 100%; outline: none;">
                </div>

                <button class="confirm-btn" onclick="confirmarPagoMovil()" style="width: 100%; margin: 0;">
                    <ion-icon name="checkmark-circle-outline"></ion-icon>
                    Confirmar Reporte de Pago
                </button>
            </div>
        </div>
    </div>

    <!-- PANTALLA DE ESPERA PAGO -->
    <div id="pm-wait-screen" class="pm-wait-screen">
        <div class="loading-spinner" style="width: 80px; height: 80px; border-width: 6px; margin-bottom: 30px;"></div>
        <h2 style="font-size: 1.8rem; margin-bottom: 15px;">Verificando Pago...</h2>
        <p id="pm-wait-message" style="color: var(--text-muted); font-size: 1.1rem; max-width: 300px; line-height: 1.6;">
            Esperando confirmación de pago en Caja...
        </p>
        <div style="margin-top: 40px; padding: 20px; background: rgba(255, 107, 0, 0.05); border-radius: 20px; border: 1px solid rgba(255, 107, 0, 0.1);">
            <p style="font-size: 0.9rem;">Por favor, no cierres esta pantalla.</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/notificaciones.js"></script>
    <script src="assets/js/cliente-app.js"></script>
</body>
</html>
