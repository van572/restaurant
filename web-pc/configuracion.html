<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - Generador de QR</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <link rel="stylesheet" href="assets/css/notificaciones.css">
    <script src="assets/js/notificaciones.js"></script>
    <!-- QRCode Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #ff6b00;
            --primary-dark: #e65c00;
            --bg: #0f1115;
            --card-bg: #1c1f26;
            --text-main: #ffffff;
            --text-muted: #aebac1;
            --border: rgba(255, 255, 255, 0.05);
            --radius: 20px;
            --shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .btn-back {
            background: white;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            color: var(--text-main);
            text-decoration: none;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn-generate {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .btn-generate:hover {
            background: var(--primary-dark);
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .qr-item {
            background: white;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            transition: border-color 0.2s;
        }

        .qr-item:hover {
            border-color: var(--primary);
        }

        .qr-code-box {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
            padding: 10px;
            background: white;
        }

        .qr-label {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: block;
        }

        .btn-download {
            background: #E7F3FF;
            color: #0064D2;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        .url-preview {
            background: #F8F9FA;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <a href="caja.html" class="btn-back">
                <ion-icon name="arrow-back" style="font-size: 1.5rem;"></ion-icon>
            </a>
            <h1>Generador de Códigos QR para Mesas</h1>
        </div>

        <div class="card">
            <div style="margin-bottom: 25px;">
                <p>Configura la URL base de tu sistema y genera etiquetas listas para imprimir.</p>
            </div>

            <div class="form-group">
                <label>URL Base del Cliente (automática)</label>
                <input type="text" id="url-base" placeholder="https://tu-sitio.com/cliente.html">
                <small style="color: var(--text-muted); margin-top: 5px;">El sistema detectó: <span id="detected-url"></span></small>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Desde la Mesa #</label>
                    <input type="number" id="mesa-inicio" value="1" min="1">
                </div>
                <div class="form-group">
                    <label>Hasta la Mesa #</label>
                    <input type="number" id="mesa-fin" value="5" min="1">
                </div>
            </div>

            <button class="btn-generate" onclick="generarLoteQR()">
                <ion-icon name="qr-code"></ion-icon>
                Generar Etiquetas
            </button>
        </div>

        <div id="result-container" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="font-size: 1.4rem;">Etiquetas Generadas</h2>
                <button class="btn-download" style="width: auto; padding: 10px 20px;" onclick="window.print()">
                    <ion-icon name="print"></ion-icon>
                    Imprimir Todas
                </button>
            </div>
            <div id="qr-grid" class="qr-grid"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/qr-generator.js"></script>
</body>
</html>
