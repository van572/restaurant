<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menú Digital - Restaurante</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="assets/css/notificaciones.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #ff6b00;
            --primary-dark: #e65c00;
            --bg: #0f1115;
            --card-bg: #1c1f26;
            --text-main: #ffffff;
            --text-muted: #aebac1;
            --border: rgba(255, 255, 255, 0.05);
            --success: #00e676;
            --shadow: 0 8px 30px rgba(0,0,0,0.4);
            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 107, 0, 0.05) 0%, transparent 60%);
        }

        .header {
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('assets/img/hero_dark_waves.jpg');
            background-size: cover;
            background-position: center;
            padding: 40px 20px;
            position: relative;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 107, 0, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
        }

        .mesa-badge {
            background-color: var(--primary);
            color: white;
            padding: 8px 20px;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
        }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes revealPlatillo {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .container {
            padding: 16px;
            padding-bottom: 120px; /* Espacio para el carrito flotante */
            animation: pageFadeIn 0.6s ease-out forwards;
        }

        .categoria-section {
            margin-bottom: 24px;
        }

        .categoria-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin: 30px 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary);
        }

        .platillo-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            gap: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1);
            animation: revealPlatillo 0.6s cubic-bezier(0.4, 0, 0.2, 1) both;
            margin-bottom: 16px;
        }

        .platillo-card:hover {
            border-color: rgba(255, 107, 0, 0.3);
            transform: translateY(-4px);
        }

        .platillo-emoji {
            font-size: 2.8rem;
            background: rgba(255, 255, 255, 0.03);
            width: 85px;
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .platillo-info {
            flex: 1;
        }
        .platillo-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: #fff;
        }

        .platillo-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .platillo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .platillo-price {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .add-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 107, 0, 0.3);
            transition: 0.2s;
        }

        .add-btn:active {
            transform: scale(0.9);
        }

        /* BOTTOM BAR / FLOAT CART */
        .cart-bar {
            position: fixed;
            bottom: 25px;
            left: 20px;
            right: 20px;
            background: var(--primary);
            padding: 18px 25px;
            border-radius: 100px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 20px 40px rgba(255, 107, 0, 0.4);
            cursor: pointer;
            transition: 0.3s;
            animation: cartSlideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
        }

        @keyframes cartSlideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .cart-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-count {
            background: var(--primary);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .cart-total {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .view-cart-btn {
            background: transparent;
            color: white;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        /* MODAL CARRITO */
        #cart-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 300;
            display: none;
            align-items: flex-end;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-height: 85vh;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .close-modal {
            font-size: 1.8rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .item-qty-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg);
            padding: 4px;
            border-radius: 12px;
        }

        .qty-btn {
            background: white;
            border: 1px solid var(--border);
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .item-price {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .item-subtotal {
            font-weight: 700;
            color: var(--text-main);
        }

        .item-notes {
            margin-top: 8px;
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            font-family: inherit;
        }

        .confirm-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,92,0,0.3);
        }

        /* ESTADOS DE CARGA / ERROR */
        .loading-view, .error-view, .success-view {
            text-align: center;
            padding: 40px 20px;
        }

        .loading-spinner {
            border: 4px solid rgba(0,0,0,0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* QR ALERT */
        .qr-alert {
            background: #FFF3CD;
            color: #856404;
            padding: 16px;
            border-radius: 12px;
            margin: 20px;
            border: 1px solid #FFEEBA;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div id="app">
        <header class="header">
            <div>
                <h1>La Cocina Real</h1>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button onclick="solicitarMesa('mesero')" style="background: var(--bg); border: 1px solid var(--border); padding: 6px; border-radius: 50%; color: var(--primary); display: flex;" title="Llamar al mesero">
                    <ion-icon name="notifications-outline" style="font-size: 1.2rem;"></ion-icon>
                </button>
                <button onclick="solicitarMesa('cuenta')" style="background: var(--bg); border: 1px solid var(--border); padding: 6px; border-radius: 50%; color: #8B5CF6; display: flex;" title="Pedir la cuenta">
                    <ion-icon name="card-outline" style="font-size: 1.2rem;"></ion-icon>
                </button>
                <div id="mesa-indicator" class="mesa-badge">Cargando mesa...</div>
            </div>
        </header>

        <!-- Barra de Estado de Pedido Activo (Flotante Superior) -->
        <div id="order-status-overlay" style="display: none; background: rgba(26, 28, 30, 0.95); position: fixed; top: 80px; left: 16px; right: 16px; z-index: 150; padding: 12px 16px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); align-items: center; gap: 12px; color: white;">
            <div style="background: var(--primary); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <ion-icon id="status-step-icon" name="timer-outline" style="font-size: 1.2rem;"></ion-icon>
            </div>
            <div style="flex: 1;">
                <div id="status-step-text" style="font-size: 0.85rem; font-weight: 700; margin-bottom: 4px;">Recibido 📝</div>
                <div style="background: rgba(255,255,255,0.1); height: 4px; border-radius: 2px; width: 100%;">
                    <div id="status-progress-bar" style="background: var(--primary); height: 100%; width: 33%; border-radius: 2px; transition: width 0.5s ease-in-out;"></div>
                </div>
            </div>
            <button onclick="this.parentElement.style.display='none'" style="background: none; border: none; color: white; opacity: 0.5;">
                <ion-icon name="close"></ion-icon>
            </button>
        </div>

        <div id="main-content" class="container">
            <!-- Los productos se cargarán dinámicamente aquí -->
            <div class="loading-view">
                <div class="loading-spinner"></div>
                <p>Cargando menú delicioso...</p>
            </div>
        </div>

        <!-- Barra de Carrito Flotante -->
        <div id="cart-bar" class="cart-bar">
            <div class="cart-info">
                <div class="cart-count">0</div>
                <div class="cart-total">$0.00</div>
            </div>
            <button class="view-cart-btn" onclick="openCart()">
                Ver pedido
                <ion-icon name="chevron-forward-outline"></ion-icon>
            </button>
        </div>
    </div>

    <!-- Modal de Carrito -->
    <div id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Tu Pedido</h2>
                <ion-icon name="close-outline" class="close-modal" onclick="closeCart()"></ion-icon>
            </div>
            
            <div id="cart-items-list">
                <!-- Items del carrito -->
            </div>

            <div style="margin-top: 20px; padding: 16px; background: var(--bg); border-radius: 16px;">
                <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem;">
                    <span>Total</span>
                    <span id="modal-total" style="color: var(--primary);">$0.00</span>
                </div>
            </div>

            <button id="send-order-btn" class="confirm-btn" onclick="enviarPedidoCliente()">
                Enviar pedido a cocina
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/notificaciones.js"></script>
    <script src="assets/js/cliente-app.js"></script>
</body>
</html>
