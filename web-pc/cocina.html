<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👨‍🍳 KDS - Control de Cocina (Tiempo Real)</title>
    <!-- Tailwind-ish Modern Google Font Pairing -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/modals.css">
    <style>
        :root {
            --color-bg-base: #0F172A;
            --color-bg-depth: #1E293B;
            --color-bg-surface: #334155;
            --color-primary: #10B981; /* Emerald Green */
            --color-secondary: #F59E0B; /* Amber/Orange */
            --color-text-main: #F8FAFC;
            --color-text-muted: #94A3B8;
            --color-border: #475569;
            --color-danger: #EF4444;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --shadow-custom: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
            --transition-all: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--color-bg-base);
            color: var(--color-text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* --- NAVBAR ESTILO PRESTIGIO --- */
        header {
            background-color: var(--color-bg-depth);
            border-bottom: 2px solid var(--color-border);
            padding: 1rem 1.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: var(--shadow-custom);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-brand h1 {
            font-family: var(--font-display);
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--color-text-main);
        }

        .header-brand .role-badge {
            background-color: rgb(16, 185, 129, 0.15);
            color: var(--color-primary);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
            border: 1px solid var(--color-primary);
            letter-spacing: 0.05em;
        }

        /* Enlaces de Navegación */
        .nav-links {
            display: flex;
            gap: 1.25rem;
        }

        .nav-button {
            text-decoration: none;
            color: var(--color-text-muted);
            font-weight: 600;
            font-size: 0.925rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: var(--transition-all);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-button:hover, .nav-button.active {
            color: var(--color-text-main);
            background-color: var(--color-bg-surface);
        }

        /* Bloque configuración derecha */
        .right-control-panel {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .connection-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 8px;
            padding: 0.4rem 0.85rem;
            font-size: 0.825rem;
            font-weight: 600;
        }

        .connection-indicator.live {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .led-dot {
            width: 8px;
            height: 8px;
            background-color: var(--color-secondary);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--color-secondary);
            animation: pulse-glow 1.5s infinite alternate;
        }

        .connection-indicator.live .led-dot {
            background-color: var(--color-primary);
            box-shadow: 0 0 8px var(--color-primary);
        }

        @keyframes pulse-glow {
            from { opacity: 0.4; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1.1); }
        }

        .btn-gear-config {
            background-color: var(--color-bg-surface);
            border: 1px solid var(--color-border);
            color: var(--color-text-main);
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-all);
        }

        .btn-gear-config:hover {
            border-color: rgb(245, 158, 11);
            background-color: rgba(245, 158, 11, 0.05);
        }

        /* --- DETALLE CONTENIDO PRINCIPAL --- */
        .kds-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1.5rem;
            padding: 1.5rem;
            flex-grow: 1;
            align-items: start;
        }

        .kds-column {
            background-color: var(--color-bg-depth);
            border-radius: 12px;
            border: 2px solid var(--color-border);
            box-shadow: var(--shadow-custom);
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 120px);
            min-height: 480px;
        }

        .kds-column-header {
            padding: 1.25rem;
            border-bottom: 2px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .kds-column-header h2 {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .column-badge {
            background-color: var(--color-bg-surface);
            color: var(--color-text-main);
            border-radius: 9999px;
            padding: 0.15rem 0.65rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid var(--color-border);
        }

        /* Colores sutiles por columna */
        .kds-column.pendiente { border-color: rgba(239, 68, 68, 0.3); } /* Rojo sutil */
        .kds-column.progreso { border-color: rgba(245, 158, 11, 0.3); } /* Amarillo sutil */
        .kds-column.listo { border-color: rgba(16, 185, 129, 0.3); } /* Verde sutil */

        .pendiente-text { color: var(--color-danger); }
        .progreso-text { color: var(--color-secondary); }
        .listo-text { color: var(--color-primary); }

        .kds-column-body {
            padding: 1.25rem;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* --- TARJETAS DE PEDIDOS (KDS CARDS) --- */
        .kds-card {
            background-color: var(--color-bg-surface);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            transition: var(--transition-all);
            overflow: hidden;
            animation: slideInDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .kds-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-custom);
            border-color: var(--color-border);
        }

        /* Bordes izquierdos remarcados según estado */
        .kds-card.border-pendiente { border-left: 5px solid var(--color-danger); }
        .kds-card.border-cocinando { border-left: 5px solid var(--color-secondary); }
        .kds-card.border-listo { border-left: 5px solid var(--color-primary); }

        .kds-card-header {
            padding: 0.85rem 1rem;
            background-color: rgba(15, 23, 42, 0.25);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mesa-badge {
            font-family: var(--font-display);
            font-weight: 700;
            background-color: var(--color-bg-base);
            color: var(--color-text-main);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            border: 1px solid var(--color-border);
        }

        .pedido-id-text {
            color: var(--color-text-muted);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            margin-left: 0.4rem;
        }

        .cronometro {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
        }
        .retraso-bajo { background-color: rgba(16, 185, 129, 0.15); color: var(--color-primary); }
        .retraso-medio { background-color: rgba(245, 158, 11, 0.15); color: var(--color-secondary); }
        .retraso-critico { background-color: rgba(239, 68, 68, 0.15); color: var(--color-danger); animation: heartbeat 1s infinite alternate; }

        @keyframes heartbeat {
            to { transform: scale(1.05); }
        }

        .kds-card-body {
            padding: 1rem;
            flex-grow: 1;
        }

        .mesero-tag {
            color: var(--color-text-muted);
            font-size: 0.8rem;
            margin-bottom: 0.75rem;
        }

        .kds-items-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .kds-item-line {
            padding-bottom: 0.4rem;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
        }
        .kds-item-line:last-child {
            border: none;
            padding-bottom: 0;
        }

        .kds-item-line .qty {
            font-family: var(--font-mono);
            font-weight: 700;
            color: var(--color-primary);
            margin-right: 0.5rem;
        }

        .kds-item-line .prod {
            font-weight: 600;
        }

        .notas-platillo {
            color: #FBBF24;
            font-size: 0.75rem;
            margin-top: 0.15rem;
            font-style: italic;
        }

        /* Footer y Botones de acción KDS */
        .kds-card-footer {
            padding: 0.75rem 1rem;
            background-color: rgba(15, 23, 42, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-kds-accion {
            width: 100%;
            background-color: var(--color-primary);
            color: var(--color-bg-base);
            border: none;
            padding: 0.55rem 1rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition-all);
            font-family: var(--font-display);
        }

        .btn-empezar {
            background-color: var(--color-secondary);
            color: #1E293B;
        }
        .btn-empezar:hover {
            background-color: #D97706;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }

        .btn-completar {
            background-color: var(--color-primary);
            color: #1E293B;
        }
        .btn-completar:hover {
            background-color: #059669;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .btn-despachar {
            background-color: #3B82F6;
            color: var(--color-text-main);
        }
        .btn-despachar:hover {
            background-color: #2563EB;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .alerta-vacia {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--color-text-muted);
            font-size: 0.875rem;
            border: 2px dashed rgba(255,255,255,0.05);
            border-radius: 8px;
        }

        /* --- NOTIFICACIONES Y MODALES MODULARES --- */
        .notificacion-floating-card {
            background-color: var(--color-bg-depth);
            border: 1px solid var(--color-border);
            border-left: 4px solid var(--color-secondary);
            color: var(--color-text-main);
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            box-shadow: var(--shadow-custom);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            pointer-events: auto;
            width: 320px;
            animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideInRight {
            from { transform: translateX(110%); }
            to { transform: translateX(0); }
        }

        @keyframes fadeOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(110%); opacity: 0; }
        }

        @keyframes slideInDown {
            from { transform: translateY(-15%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .notificacion-icon { font-size: 1.2rem; }
        .notificacion-body { display: flex; flex-direction: column; }
        .notificacion-text { font-size: 0.85rem; font-weight: 600; }
        .notificacion-time { font-size: 0.7rem; color: var(--color-text-muted); }

        /* Contenedor flotante lateral del menú */
        .mini-menu-bar {
            margin: 0 1.5rem 1.5rem 1.5rem;
            background-color: var(--color-bg-depth);
            border-radius: 12px;
            border: 1px solid var(--color-border);
            padding: 1rem 1.5rem;
        }

        .mini-menu-header {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            color: var(--color-secondary);
        }

        .menu-items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }

        .menu-item-row {
            display: flex;
            justify-content: space-between;
            background-color: var(--color-bg-surface);
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-size: 0.825rem;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .menu-name { font-weight: 600; }
        .menu-price { color: var(--color-primary); font-family: var(--font-mono); font-weight: 700; }

        @media(max-width: 1024px) {
            .kds-container { grid-template-columns: 1fr; }
            .kds-column { max-height: none; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR NAVEGABLE -->
    <header>
        <div class="header-brand">
            <h1>👨‍🍳 RESTAURANTE EN TIEMPO REAL</h1>
            <span class="role-badge">KITCHEN DEPT</span>
        </div>
        
        <nav class="nav-links">
            <a href="cocina.html" class="nav-button active">Cocina (KDS)</a>
            <a href="caja.html" class="nav-button">Caja (Cuentas)</a>
            <a href="auditoria.html" class="nav-button">Auditoría Diaria</a>
        </nav>

        <div class="right-control-panel">
            <div id="connection-status-badge" class="connection-indicator">
                <span class="led-dot"></span>
                <span id="connection-status-text">Buscando Servidor...</span>
            </div>
            <button class="btn-gear-config" onclick="SettingsModal.abrir()" title="Configuración de Base de Datos">⚙️</button>
        </div>
    </header>

    <!-- TABLERO KDS KANBAN DE TRES COLUMNAS -->
    <main class="kds-container">
        
        <!-- COLUMNA 1: PENDIENTES -->
        <section class="kds-column pendiente">
            <div class="kds-column-header">
                <h2 class="pendiente-text">📋 Nuevos Pedidos</h2>
                <span id="badge-pendientes" class="column-badge">0</span>
            </div>
            <div id="lista-pendientes" class="kds-column-body">
                <div class="alerta-vacia">Cargando órdenes...</div>
            </div>
        </section>

        <!-- COLUMNA 2: COCINANDO -->
        <section class="kds-column progreso">
            <div class="kds-column-header">
                <h2 class="progreso-text">🔥 En Preparación</h2>
                <span id="badge-progreso" class="column-badge">0</span>
            </div>
            <div id="lista-progreso" class="kds-column-body">
                <div class="alerta-vacia">Cargando órdenes...</div>
            </div>
        </section>

        <!-- COLUMNA 3: LISTOS -->
        <section class="kds-column listo">
            <div class="kds-column-header">
                <h2 class="listo-text">🍽️ Listo para Servir</h2>
                <span id="badge-listos" class="column-badge">0</span>
            </div>
            <div id="lista-listos" class="kds-column-body">
                <div class="alerta-vacia">Cargando órdenes...</div>
            </div>
        </section>

    </main>

    <!-- SECCIÓN EXTRA: REFERENCIA RÁPIDA DE PRECIOS DEL MENÚ -->
    <aside class="mini-menu-bar">
        <div class="mini-menu-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-border); padding-bottom: 6px; margin-bottom: 10px;">
            <span style="display: flex; align-items: center; gap: 6px;">📋 Menú Activo & Precios</span>
            <button onclick="MenuEditor.abrirModal()" style="background: var(--color-bg-surface); border: 1px solid var(--color-border); border-radius: 4px; padding: 3px 8px; font-size: 0.75rem; cursor: pointer; color: var(--color-secondary); font-family: var(--font-display); font-weight: bold; display: flex; align-items: center; gap: 4px;" title="Configurar, agregar o re-escribir platos desde cero">⚙️ Configurar</button>
        </div>
        <div id="menu-items-pricing" class="menu-items-grid">
            <!-- Render dinámico del menú cargado por la App -->
        </div>
    </aside>

    <!-- DEPENDENCIAS SCRIPT JS DE CDN Y INTERNAS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/realtime-listeners.js"></script>
    
    <script>
        // Inicializador del controlador exclusivo de Cocina
        document.addEventListener('DOMContentLoaded', async () => {
            // Inicializar KDS
            await CocinaController.init();

            // Configurar estatus de conexión sutil en la barra superior
            const badge = document.getElementById('connection-status-badge');
            const txt = document.getElementById('connection-status-text');
            if (DataService.isReal()) {
                badge.classList.add('live');
                txt.textContent = 'CONECTADO NUBE';
            } else {
                badge.classList.remove('live');
                txt.textContent = 'DEMO LOCAL';
            }

            // Actualizar cronómetros de tarjetas cada minutos
            setInterval(() => {
                CocinaController.renderListas();
            }, 30000);
        });
    </script>
</body>
</html>
