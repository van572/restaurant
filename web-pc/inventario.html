<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario | Control de Stock</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/notificaciones.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    
    <style>
        :root {
            --bg: #0f1115;
            --surface: #1c1f26;
            --primary: #ff6b00;
            --accent: #00e676;
            --text: #ffffff;
            --dim: #aebac1;
            --border: rgba(255, 255, 255, 0.05);
            --shadow: 0 10px 30px rgba(0,0,0,0.4);
            --font: 'Plus Jakarta Sans', sans-serif;
        }

        * { margin:0; padding:0; box-sizing:border-box; outline:none; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 20px 40px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left h1 { font-size: 1.4rem; color: #fff; }
        .header-left p { font-size: 0.85rem; color: var(--dim); }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .btn-primary { background: var(--primary); color: #fff; border: none; box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3); }
        .btn-surface { background: var(--surface); color: var(--text); }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        main {
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            flex-grow: 1;
        }

        /* --- DASHBOARD STATS --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--surface);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-card h3 { font-size: 0.85rem; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .value { font-size: 1.8rem; font-weight: 800; color: #fff; }
        .stat-card .meta { font-size: 0.8rem; color: var(--accent); }
        .stat-card.alert .meta { color: var(--primary); }

        /* --- PRODUCT TABLE --- */
        .table-container {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgba(48, 54, 61, 0.5);
            text-align: left;
            padding: 15px 20px;
            font-size: 0.85rem;
            color: var(--dim);
            font-weight: 600;
        }

        td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        tr:last-child td { border: none; }

        .stock-label {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            background: rgba(35, 134, 54, 0.15);
            color: #3fb950;
        }

        .stock-label.low {
            background: rgba(248, 81, 73, 0.15);
            color: #ff7b72;
        }

        /* --- BARCODE SCANNER OVERLAY --- */
        .scanner-alert {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--accent);
            color: #fff;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            animation: slideUp 0.3s ease-out;
            z-index: 200;
        }

        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } }

        /* --- MODAL --- */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            display: none;
            place-content: center;
            z-index: 1000;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow);
        }

        .modal h2 { margin-bottom: 20px; color: #fff; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: var(--dim); }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
        }
        .form-group input:focus { border-color: var(--primary); }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <h1>Panel de Inventario</h1>
            <p>Control de stock y alertas automáticas</p>
        </div>
        <div style="display: flex; gap: 12px;">
            <button class="btn btn-surface" onclick="location.href='index.html'">
                <ion-icon name="home-outline"></ion-icon> Dashboard
            </button>
            <button class="btn btn-primary" onclick="Inventario.abrirModalRegistro()">
                <ion-icon name="add-outline"></ion-icon> Nuevo Producto
            </button>
        </div>
    </header>

    <main>
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Productos</h3>
                <div class="value" id="stat-total">0</div>
                <div class="meta">En catálogo</div>
            </div>
            <div class="stat-card alert" id="card-alertas">
                <h3>Alertas Stock Bajo</h3>
                <div class="value" id="stat-alertas">0</div>
                <div class="meta" id="alertas-msg">Todo normal</div>
            </div>
            <div class="stat-card">
                <h3>Ventas Hoy</h3>
                <div class="value" id="stat-ventas">0</div>
                <div class="meta" id="ventas-msg">Items vendidos</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Barra</th>
                        <th>Categoría</th>
                        <th>Stock Actual</th>
                        <th>Mínimo</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="inventory-body">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- MODAL REGISTRO / EDICIÓN -->
    <div class="overlay" id="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">Registrar Producto</h2>
            <form id="product-form">
                <input type="hidden" id="p-id">
                <div class="form-group">
                    <label>Código de Barras (Escanea ahora)</label>
                    <input type="text" id="p-barcode" required placeholder="Gira el escáner...">
                </div>
                <div class="form-group">
                    <label>Nombre del Producto</label>
                    <input type="text" id="p-name" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="p-category">
                            <option value="licores">Licores</option>
                            <option value="alimentos">Alimentos</option>
                            <option value="carnes">Carnes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>U. Medida</label>
                        <select id="p-unit">
                            <option value="unid">Unidad</option>
                            <option value="kg">Kilogramo</option>
                        </select>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Precio Base</label>
                        <input type="number" id="p-price" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Stock Inicial</label>
                        <input type="number" id="p-stock" step="0.001" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Stock Mínimo (Alerta)</label>
                    <input type="number" id="p-min" step="0.001" required value="5">
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-surface" onclick="Inventario.cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCANNER INDICATOR -->
    <div id="scanner-indicator" class="scanner-alert" style="display: none;">
        <ion-icon name="barcode-outline"></ion-icon>
        <span>MODO ESCÁNER ACTIVO</span>
    </div>

    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/notificaciones.js"></script>
    <script>
        const Inventario = {
            data: [],
            bufferScanner: "",
            timeoutScanner: null,

            async init() {
                await this.fetchInventory();
                await this.fetchVentasHoy();
                this.setupScanner();
                this.setupForm();
            },

            async fetchInventory() {
                const { data, error } = await window.supabaseClient
                    .from('productos_venta')
                    .select('*')
                    .order('nombre');
                
                if (error) return console.error(error);
                this.data = data;
                this.render();
                this.updateStats();
            },

            async fetchVentasHoy() {
                const hoy = new Date().toISOString().split('T')[0];
                const { data, error } = await window.supabaseClient
                    .from('ventas_pos')
                    .select('articulos')
                    .gte('fecha', hoy);

                if (error) return;

                let count = 0;
                data.forEach(v => {
                    v.articulos.forEach(a => count += a.cantidad);
                });

                document.getElementById('stat-ventas').textContent = count.toFixed(0);
                document.getElementById('ventas-msg').textContent = `${data.length} Transacciones`;
            },

            render() {
                const tbody = document.getElementById('inventory-body');
                tbody.innerHTML = this.data.map(p => {
                    const isLow = p.stock <= p.stock_minimo;
                    return `
                        <tr onclick="Inventario.editarProducto(${p.id})">
                            <td style="font-weight:700; color:#fff;">${p.nombre}</td>
                            <td style="font-family:monospace; color:var(--dim);">${p.codigo_barras}</td>
                            <td>${p.categoria}</td>
                            <td>${p.stock} ${p.unidad_medida}</td>
                            <td>${p.stock_minimo}</td>
                            <td>
                                <span class="stock-label ${isLow ? 'low' : ''}">
                                    ${isLow ? 'BAJO CONTROL' : 'EN ORDEN'}
                                </span>
                            </td>
                        </tr>
                    `;
                }).join('');
            },

            updateStats() {
                const alerts = this.data.filter(p => p.stock <= p.stock_minimo).length;
                document.getElementById('stat-total').textContent = this.data.length;
                document.getElementById('stat-alertas').textContent = alerts;
                
                const cardAlert = document.getElementById('card-alertas');
                const alertMsg = document.getElementById('alertas-msg');
                
                if (alerts > 0) {
                    cardAlert.classList.add('alert');
                    alertMsg.textContent = "¡Reponer pronto!";
                    alertMsg.style.color = "var(--primary)";
                } else {
                    cardAlert.classList.remove('alert');
                    alertMsg.textContent = "Todo en orden";
                    alertMsg.style.color = "var(--accent)";
                }
            },

            setupScanner() {
                window.addEventListener('keydown', (e) => {
                    // Si estamos en un input, no procesar escaneo global
                    if (document.activeElement.tagName === 'INPUT' && document.activeElement.id !== 'p-barcode') return;

                    const indicator = document.getElementById('scanner-indicator');
                    
                    if (e.key === 'Enter') {
                        if (this.bufferScanner.length > 0) {
                            this.buscarYEditar(this.bufferScanner);
                            this.bufferScanner = "";
                            indicator.style.display = 'none';
                        }
                    } else {
                        if (e.key.length === 1) {
                            this.bufferScanner += e.key;
                            indicator.style.display = 'flex';
                        }
                    }

                    clearTimeout(this.timeoutScanner);
                    this.timeoutScanner = setTimeout(() => {
                        this.bufferScanner = "";
                        indicator.style.display = 'none';
                    }, 500);
                });
            },

            buscarYEditar(barcode) {
                const p = this.data.find(x => x.codigo_barras === barcode);
                if (p) {
                    this.editarProducto(p.id);
                    Toast.info("Producto Encontrado", `Editando ${p.nombre}`);
                } else {
                    this.abrirModalRegistro();
                    document.getElementById('p-barcode').value = barcode;
                    Toast.success("Nuevo Código", "Registrando producto desconocido.");
                }
            },

            abrirModalRegistro() {
                document.getElementById('product-form').reset();
                document.getElementById('p-id').value = "";
                document.getElementById('modal-title').textContent = "Registrar Nuevo";
                document.getElementById('modal-overlay').style.display = 'grid';
                document.getElementById('p-barcode').focus();
            },

            editarProducto(id) {
                const p = this.data.find(x => x.id === id);
                if (!p) return;

                document.getElementById('p-id').value = p.id;
                document.getElementById('p-barcode').value = p.codigo_barras;
                document.getElementById('p-name').value = p.nombre;
                document.getElementById('p-category').value = p.categoria;
                document.getElementById('p-unit').value = p.unidad_medida;
                document.getElementById('p-price').value = p.precio_base;
                document.getElementById('p-stock').value = p.stock;
                document.getElementById('p-min').value = p.stock_minimo;

                document.getElementById('modal-title').textContent = "Editar Producto";
                document.getElementById('modal-overlay').style.display = 'grid';
            },

            cerrarModal() {
                document.getElementById('modal-overlay').style.display = 'none';
            },

            setupForm() {
                const form = document.getElementById('product-form');
                form.onsubmit = async (e) => {
                    e.preventDefault();
                    
                    const id = document.getElementById('p-id').value;
                    const payload = {
                        codigo_barras: document.getElementById('p-barcode').value,
                        nombre: document.getElementById('p-name').value,
                        categoria: document.getElementById('p-category').value,
                        unidad_medida: document.getElementById('p-unit').value,
                        precio_base: parseFloat(document.getElementById('p-price').value),
                        stock: parseFloat(document.getElementById('p-stock').value),
                        stock_minimo: parseFloat(document.getElementById('p-min').value)
                    };

                    let res;
                    if (id) {
                        res = await window.supabaseClient.from('productos_venta').update(payload).eq('id', id);
                    } else {
                        res = await window.supabaseClient.from('productos_venta').insert(payload);
                    }

                    if (res.error) {
                        Toast.error("Error al guardar", res.error.message);
                    } else {
                        Toast.success("Inventario Actualizado", `${payload.nombre} guardado correctamente.`);
                        this.cerrarModal();
                        this.fetchInventory();
                    }
                };
            }
        };

        window.onload = () => Inventario.init();
    </script>
</body>
</html>
